<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="730" viewBox="0 0 1250 730"><title>master logical data model</title><rect width="100%" height="100%" fill="#f6f5ef"/><style>text{fill:#192d26;font-family:Arial,sans-serif}.wire{fill:none;stroke:#73886a;stroke-width:2}.request{stroke-dasharray:7 4}.context{stroke-dasharray:3 4}.platform{font-size:9px;fill:#69716a}.title{font-size:18px;font-family:Georgia,serif}.subtitle{font-size:11px;fill:#69716a}</style><defs><marker id="entity" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#73886a"/></marker><marker id="entity-incoming" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#2469a2"/></marker><marker id="entity-outgoing" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#26764f"/></marker><marker id="entity-both" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#79569b"/></marker></defs><text x="35" y="45" font-size="27">Product identity / lineage contracts</text><text x="35" y="78" font-size="12">Logical relationships within the versioned JSON snapshot; canonical attribute survivorship is a production extension.</text><path class="wire" d="M365 224.5L450 224.5" marker-end="url(#entity)"><title>1:N left/right source references</title></path><path class="wire" d="M780 224.5L865 224.5" marker-end="url(#entity)"><title>1:N versioned steward decisions</title></path><path class="wire" d="M365 224.5L446 224.5L446 425.5L450 425.5" marker-end="url(#entity)"><title>1:1 accepted mapping per version</title></path><path class="wire" d="M365 449.5L450 449.5" marker-end="url(#entity)"><title>1:N regional source mappings</title></path><path class="wire" d="M865 449.5L784 449.5L784 519L369 519L369 449.5L365 449.5" marker-end="url(#entity)"><title>one consistent published version</title></path><path class="wire" d="M865 449.5L780 449.5" marker-end="url(#entity)"><title>same publication marker</title></path><rect x="35" y="135" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="52" y="168" font-size="19">Regional source</text><text x="52" y="201" font-size="12">PK: source_key (globally unique)</text><text x="52" y="228" font-size="12">manufacturer part + hard specs</text><text x="52" y="255" font-size="12">Original representation / lineage</text><rect x="450" y="135" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="467" y="168" font-size="19">Candidate pair</text><text x="467" y="201" font-size="12">PK: pair_id</text><text x="467" y="228" font-size="12">FK: left_source + right_source</text><text x="467" y="255" font-size="12">score evidence / rule version</text><rect x="865" y="135" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="882" y="168" font-size="19">Steward decision</text><text x="882" y="201" font-size="12">FK: pair_id</text><text x="882" y="228" font-size="12">actor / approve or reject</text><text x="882" y="255" font-size="12">expected revision / audit history</text><rect x="35" y="360" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="52" y="393" font-size="19">Canonical product</text><text x="52" y="426" font-size="12">PK: global_id + publish_version</text><text x="52" y="453" font-size="12">Member source keys</text><text x="52" y="480" font-size="12">Stable identity / explicit migrations</text><rect x="450" y="360" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="467" y="393" font-size="19">Regional crosswalk</text><text x="467" y="426" font-size="12">FK: source_key / global_id</text><text x="467" y="453" font-size="12">Same publish_version</text><text x="467" y="480" font-size="12">One mapping per source/version</text><rect x="865" y="360" width="330" height="155" rx="7" fill="#fcfbf7" stroke="#adc0a1"/><text x="882" y="393" font-size="19">Publication pointer</text><text x="882" y="426" font-size="12">active publish_version</text><text x="882" y="453" font-size="12">Input/decision snapshot digest</text><text x="882" y="480" font-size="12">Atomic master + crosswalk snapshot</text><text x="35" y="575" class="platform">RELATIONSHIPS / INVARIANTS</text><text x="35" y="603" font-size="12">source → pair : 1:N left/right source references</text><text x="635" y="603" font-size="12">pair → decision : 1:N versioned steward decisions</text><text x="35" y="629" font-size="12">source → crosswalk : 1:1 accepted mapping per version</text><text x="635" y="629" font-size="12">canonical → crosswalk : 1:N regional source mappings</text><text x="35" y="655" font-size="12">publication → canonical : one consistent published version</text><text x="635" y="655" font-size="12">publication → crosswalk : same publication marker</text></svg>
