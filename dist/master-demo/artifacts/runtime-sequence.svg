<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="740" viewBox="0 0 1250 740"><title>master runtime sequence</title><rect width="100%" height="100%" fill="#f6f5ef"/><style>text{fill:#192d26;font-family:Arial,sans-serif}.wire{fill:none;stroke:#73886a;stroke-width:2}.request{stroke-dasharray:7 4}.context{stroke-dasharray:3 4}.platform{font-size:9px;fill:#69716a}.title{font-size:18px;font-family:Georgia,serif}.subtitle{font-size:11px;fill:#69716a}</style><defs><marker id="sequence" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#577568"/></marker><marker id="sequence-incoming" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#2469a2"/></marker><marker id="sequence-outgoing" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#26764f"/></marker><marker id="sequence-both" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#79569b"/></marker></defs><text x="35" y="45" font-size="27">Steward decision / publication sequence</text><text x="35" y="77" font-size="12">Logical local calls; conditional paths run only when needed. Cloud endpoints are separate reference bindings.</text><rect x="25" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="140" y="130" text-anchor="middle" font-size="13">Steward browser</text><path d="M140 148L140 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><rect x="345" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="460" y="130" text-anchor="middle" font-size="13">API / identity boundary</text><path d="M460 148L460 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><rect x="665" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="780" y="130" text-anchor="middle" font-size="13">Resolution / state</text><path d="M780 148L780 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><rect x="985" y="103" width="230" height="45" rx="5" fill="#e9eddf"/><text x="1100" y="130" text-anchor="middle" font-size="13">Published snapshot</text><path d="M1100 148L1100 680" stroke="#b7c4ae" stroke-dasharray="5 4"/><path class="wire" d="M140 187L460 187" marker-end="url(#sequence)"/><text x="153" y="178" font-size="12">Action + expected workspace revision</text><path class="wire" d="M460 247L780 247" marker-end="url(#sequence)"/><text x="473" y="238" font-size="12">Load owner / inputs / persistent decisions</text><path class="wire" d="M780 307H840V330H780" marker-end="url(#sequence)"/><text x="850" y="322" font-size="11">Normalize, block and check whole clusters</text><path class="wire request" d="M780 367L460 367" marker-end="url(#sequence)"/><text x="473" y="358" font-size="12">Validated groups or ambiguity/conflict</text><path class="wire" d="M460 427L1100 427" marker-end="url(#sequence)"/><text x="473" y="418" font-size="12">If publish: atomic CAS snapshot</text><path class="wire request" d="M1100 487L460 487" marker-end="url(#sequence)"/><text x="473" y="478" font-size="12">Same-version master / crosswalk / pointer</text><path class="wire request" d="M460 547L140 547" marker-end="url(#sequence)"/><text x="153" y="538" font-size="12">Decision evidence / audit / version</text><text x="35" y="713" class="subtitle">Independent synthetic implementation · requests and results follow declared actor direction.</text></svg>
