.5L915 99.5" marker-end="url(#arrow)"><title>Persistent approve/reject decisions</title></path><path class="wire data" d="M870 304.5L915 304.5" marker-end="url(#arrow)"><title>Validated complete groups</title></path><path class="wire request" d="M575 280.5L616 280.5L616 231L911 231L911 280.5L915 280.5" marker-end="url(#arrow)"><title>Publish expected revision</title></path><path class="wire data" d="M915 304.5L874 304.5L874 436L284 436L284 485.5L280 485.5" marker-end="url(#arrow)"><title>One version of master and crosswalk</title></path><path class="wire data" d="M915 99.5L874 99.5L874 231L284 231L284 280.5L280 280.5" marker-end="url(#arrow)"><title>Ambiguous pair evidence</title></path><path class="wire context" d="M325 99.5L321 99.5L321 485.5L325 485.5" marker-end="url(#arrow)"><title>Quarantine and batch checks</title></path><path class="wire context" d="M915 304.5L874 304.5L874 485.5L575 485.5" marker-end="url(#arrow)"><title>Publication/version evidence</title></path><g><rect x="30" y="30" width="250" height="115" rx="6" fill="#fcfbf7" stroke="#adc0a1" stroke-dasharray="5 3"/><text class="platform" x="43" y="55">SAP / UPSTREAM INGESTION</text><text class="title" x="43" y="88">Regional source records</text><text class="subtitle" x="43" y="122">NA · EMEA · APAC</text></g><g><rect x="325" y="30" width="250" height="115" rx="6" fill="#fcfbf7" stroke="#adc0a1" stroke-dasharray="5 3"/><text class="platform" x="338" y="55">SNOWPARK / RULE STORE</text><text class="title" x="338" y="88">Normalize &amp; quarantine</text><text class="subtitle" x="338" y="122">Schema · taxonomy · specs</text></g><g><rect x="620" y="30" width="250" height="115" rx="6" fill="#fcfbf7" stroke="#adc0a1" stroke-dasharray="5 3"/><text class="platform" x="633" y="55">SNOWFLAKE SQL / PYTHON</text><text class="title" x="633" y="88">Block candidate pairs</text><text class="subtitle" x="633" y="122">Spec buckets + known part IDs</text></g><g><rect x="915" y="30" width="250" height="115" rx="6" fill="#