<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><title>Regional ingestion and replay</title><rect width="100%" height="100%" fill="#f6f5ef"/><style>text{fill:#192d26;font-family:Arial,sans-serif}.wire{fill:none;stroke:#73886a;stroke-width:2}.request{stroke-dasharray:7 4}.context{stroke-dasharray:3 4}.platform{font-size:9px;fill:#69716a}.title{font-size:18px;font-family:Georgia,serif}.subtitle{font-size:11px;fill:#69716a}</style><defs><marker id="flow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#73886a"/></marker><marker id="flow-incoming" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#2469a2"/></marker><marker id="flow-outgoing" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#26764f"/></marker><marker id="flow-both" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="#79569b"/></marker></defs><text x="35" y="45" font-size="25" font-family="Georgia">Regional ingestion and replay</text><text x="35" y="76" font-size="12">Independent synthetic implementation / source and cloud bindings are separate.</text><rect x="35" y="120" width="210" height="135" rx="7" fill="#e9eddf" stroke="#adc0a1"/><text x="50" y="151" class="platform">01</text><text x="50" y="184" font-size="17">Regional input</text><text x="50" y="215" font-size="11">Stable source keys</text><path class="wire" d="M245 187L264 187" marker-end="url(#flow)"/><rect x="267" y="120" width="210" height="135" rx="7" fill="#e9eddf" stroke="#adc0a1"/><text x="282" y="151" class="platform">02</text><text x="282" y="184" font-size="17">Normalize</text><text x="282" y="215" font-size="11">Schema + taxonomy</text><path class="wire" d="M477 187L496 187" marker-end="url(#flow)"/><rect x="499" y="120" width="210" height="135" rx="7" fill="#e9eddf" stroke="#adc0a1"/><text x="514" y="151" class="platform">03</text><text x="514" y="184" font-size="17">Block &amp; match</text><text x="514" y="215" font-size="11">Hard specs + identity</text><path class="wire" d="M709 187L728 187" marker-end="url(#flow)"/><rect x="731" y="120" width="210" height="135" rx="7" fill="#e9eddf" stroke="#adc0a1"/><text x="746" y="151" class="platform">04</text><text x="746" y="184" font-size="17">Review / quarantine</text><text x="746" y="215" font-size="11">Ambiguity / source conflicts</text><path class="wire" d="M941 187L960 187" marker-end="url(#flow)"/><rect x="963" y="120" width="210" height="135" rx="7" fill="#e9eddf" stroke="#adc0a1"/><text x="978" y="151" class="platform">05</text><text x="978" y="184" font-size="17">Publish / retain</text><text x="978" y="215" font-size="11">Complete valid snapshot</text></svg>
